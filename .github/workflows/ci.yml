name: CI

# Corre en pull requests hacia main y en el push a main que resulta del merge.
# Antes corría en `branches: ['**']`, lo que duplicaba ejecuciones por cada push
# a una rama con PR abierto (una por push y otra por pull_request).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Una ejecución por ref: un push nuevo cancela la anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # `build` va primero: el paquete NestJS consume los tipos de
      # sri-ec desde su dist/, así que typecheck y test lo necesitan.
      - run: npm run build

      - run: npm run typecheck

      - run: npm test

      # Empaqueta sri-ec de verdad (npm pack) y lo instala en un proyecto
      # descartable con un `npm install` liso — sin esto, un regreso
      # accidental a `optionalDependencies` (ver package.json de sri-ec) solo
      # se habría notado en el próximo `npm install sri-ec` de un usuario,
      # no en CI: los tests unitarios corren contra el código fuente vía
      # vitest, nunca contra el tarball publicado.
      - run: npm run verify:isolation
